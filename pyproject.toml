[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "london-property-analysis"
version = "0.1.0"
description = "London property price ingestion and analysis toolkit."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
london-property-analysis = "london_property_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
